<!doctype html>
<html>
<head><style>*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;color:#181d1a;background:#fff;display:flex;flex-direction:column;height:100vh}
h3{margin:0;font-size:13px;font-weight:600;padding:14px 16px 10px;flex-shrink:0;letter-spacing:-0.01em}
.body{flex:1;overflow-y:auto;padding:0 16px 4px;font-size:12px}
.actions{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #e3e6e0;flex-shrink:0;background:#fafbf9}
button{font:inherit;font-weight:500;font-size:12.5px;padding:7px 14px;border-radius:6px;border:1px solid #cbd1c7;background:#fff;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.04);transition:transform .06s ease, box-shadow .06s ease}
button:hover{border-color:#a8b0a2}
button:active{transform:translateY(1px);box-shadow:none}
button.primary{background:#9a5b21;border-color:#9a5b21;color:#fff}
button.primary:hover{background:#85501d}
button.danger{color:#a3311f;border-color:#e2b3a8}
.muted{color:#5c6660}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;background:#f1f3ef;border-radius:3px;padding:1px 4px}
.tag{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:3px;flex-shrink:0}
.tag.mod{background:#faedd2;color:#96631a}
.tag.new{background:#dff0e6;color:#1f7a52}
.tag.info{background:#e8eff8;color:#3a6ea5}
.tag.num{background:#eef0ec;color:#5c6459}
.item{padding:10px 0;border-bottom:1px solid #edefe9}
.item:last-child{border-bottom:0}
.item .row1{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.item .path{font-weight:600;font-size:12px}
.item .why{color:#5c6660;font-size:11.5px;line-height:1.45}
ul.plain{margin:0;padding:0;list-style:none}
ul.bullets{margin:6px 0 0;padding-left:16px}
ul.bullets li{margin-bottom:4px;font-size:11.5px}
table.cmp{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:4px}
table.cmp th{text-align:left;color:#5c6660;font-weight:600;padding:5px 6px;border-bottom:1px solid #e3e6e0;font-family:ui-monospace,monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em}
table.cmp td{padding:6px;border-bottom:1px solid #edefe9;vertical-align:top}
.check{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:11.5px}
.check .mark{flex-shrink:0;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;margin-top:1px;font-weight:700}
.check .mark.pass{background:#1f7a52}
.check .mark.fail{background:#a3311f}
.banner{margin-top:2px;padding:9px 11px;border-radius:6px;font-weight:600;font-size:12px;border:1px solid}
.banner.ok{background:#dff0e6;color:#1f7a52;border-color:#a9d9c1}
.priority{font-family:ui-monospace,monospace;font-size:9px;font-weight:700;text-transform:uppercase;padding:1px 5px;border-radius:3px;margin-left:6px}
.priority.high{background:#fbeae6;color:#a3311f}
.priority.med{background:#faedd2;color:#96631a}
.excerpt{background:#f4f5f3;border-left:2px solid #9a5b21;border-radius:0 6px 6px 0;padding:11px 12px;font-size:11px;line-height:1.55;color:#3a4038;margin-top:8px;font-style:italic}
h4.section{font-family:ui-monospace,monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#8a9186;margin:16px 0 5px}
h4.section:first-child{margin-top:2px}</style></head>
<body>
  <h3>Files Identified</h3>
  <div class="body">

    <h4 class="section">Search approach</h4>
    <p class="muted" id="approach" style="margin:0"></p>
    <h4 class="section">Exclusions applied</h4>
    <p id="exclusions" style="margin:2px 0 0"></p>
    <h4 class="section">Gaps found</h4>
    <ul class="plain" id="files"></ul>
    <script>
      window.onViewData = function(d){
        d = d.approve || {}
        document.getElementById('approach').textContent = d.approach || ''
        document.getElementById('exclusions').innerHTML = (d.exclusions||[]).map(function(e){ return '<code>'+e+'</code>' }).join(' ')
        document.getElementById('files').innerHTML = (d.files||[]).map(function(f){
          return '<li class="item"><div class="path"><code>'+f.path+'</code></div><div class="why">'+f.reason+'</div></li>'
        }).join('')
      }
    </script>

  </div>
  <div class="actions">
<button onclick="send('approve')" class="primary">Approve</button>
  <button onclick="send('reject')" class="danger">Reject</button>
  <button onclick="send('modify')">Request changes</button>
  </div>
  <script>
function send(operationId){ parent.postMessage({type:'operation', operationId}, '*') }
window.addEventListener('message', function(e){
  if (e.data && e.data.type === 'view-data' && window.onViewData) window.onViewData(e.data.data || {})
})
  </script>
</body>
</html>
